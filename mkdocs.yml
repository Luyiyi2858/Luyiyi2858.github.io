site_name: 路依依的随心记
theme:
  name: material
  language: zh
  features:
    - navigation.tabs

markdown_extensions:
  - meta
  - admonition
  - pymdownx.superfences

extra_css:
  - stylesheets/extra.css

nav:
  - 主页: index.md
  - 课程:
      - 课程首页: course/index.md
      - 示例文档: course/example.md
  - Apex: apex/index.md
  - 关于: about/index.md
  - 友链: friends/index.md